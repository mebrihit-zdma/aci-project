<ul class="bg-white border border-[#E9EAEB] rounded-xl text-sm text-[#535862] text-sm pt-[4px]">
    <li class="grid grid-cols-[1.5fr_1fr_1fr_1fr_1fr_1fr_0.5fr] gap-4 border-b-1 border-[#E9EAEB] py-3 px-4 ps-[24px]">
        <div class="flex gap-2 justify-start items-center">
            Documentation
        </div>
        <div class="flex items-center">Product</div>
        <div class="flex items-center">Type</div>
        <div class="flex items-center">Status</div>
        <div class="flex items-center">Delivery date</div>
        <div class="flex items-center">Executed by</div>
    </li>
    <li class="grid grid-cols-[1.5fr_1fr_1fr_1fr_1fr_1fr_0.5fr] gap-4 border-b-1 border-[#E9EAEB] py-3 px-4 ps-[24px] last:border-b-0" *ngFor="let item of data">
        <div class="flex gap-2 justify-start items-center">
            {{ item.documentation }}
        </div>
        <div class="flex items-center">{{ item.product }}</div>
        <div class="flex items-center">{{ item.type }}</div>
        <div class="flex items-center">
            <span class="bg-[#ECFDF3] px-5 py-2 rounded-[16px] text-[#027A48] text-xs font-medium"
                [ngStyle]="{
                    'background-color': item.status === 'Published' ? '#ECFDF3' : '#F5F5F5',
                    'color': item.status === 'Published' ? '#027A48' : '#414651'
                }">
                {{ item.status }}
            </span>
        </div>
        <div class="flex items-center">{{ item.deliveryDate }}</div>
        <div class="flex justify-start items-center gap-[10px]">
            <div class="border border-[#9D9D9D] rounded-[200px] w-[40px] h-[40px] bg-[url('./app/resources/icons/profile-picture.svg')] ">
            </div>
            {{ item.executedBy }}
        </div>
        <div class="text-[#2726DD] font-semibold flex items-center">{{ item.view }}</div>
    </li>
</ul>
