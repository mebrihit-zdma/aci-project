<div class="h-[100%] flex flex-col justify-between">
    <!-- dropdown section -->
    <div class="flex justify-between mb-2 ml-[60px] md:ml-0">
        <div class="flex relative">
            <div class="flex gap-[16px]">
                <!-- ACI payment hub dropdown section -->
                <div class="my-auto bg-white border border-[#D5D7DA] rounded-[8px] px-[16px] py-[10px] flex items-center gap-[8px] shadow-[0px_1px_2px_rgba(10,13,18,0.05)] text-[#666F8D] text-sm font-medium">
                    <select>
                        <option class="bg-gray-200 text-black" value="" disabled selected>ACI Payment Hub</option>
                        <option class="bg-gray-200 text-black"></option>
                    </select>
                </div>
            </div>
        </div>
        <!-- bell icon -->
        <span class="w-[22.76px] h-[29.25px] bg-[url('./app/resources/icons/blue-bell-icon.svg')]"></span>
    </div>
    <!-- question and answer -->
    <div class="w-[90%] ml-auto mr-auto mb-[50px]">
        <div class="flex flex-col justify-center gap-[24px]">
            <!-- question -->
            <div class="flex justify-end">
            
                    <p class="bg-white flex py-[10px] px-[12px] border border-[#D5D7DA] text-sm rounded-tl-lg rounded-tr-none rounded-br-lg rounded-bl-lg max-w-[70%]">{{question}}</p>
                
            </div>
            <!-- answer -->
            <div class="">
                <!-- Chat Answer -->
                <div class="flex">
                    <div class="mt-[-4px] w-[36px] h-[36px] scale-[0.7] bg-[url('./app/resources/icons/blue-chat-icon.svg')]"></div>
                    <div class="bg-white flex py-[10px] px-[12px] w-[100%] lg:w-[60%] border border-[#D5D7DA] text-sm rounded-tl-none rounded-tr-lg rounded-br-lg rounded-bl-lg sm:pe-[40px]">
                        <div class="ml-[12px] mt-[16px] mb-[16px] chat-answer" [innerHTML]="safeHtmlAnswer"></div>
                    </div>
                </div>
                <!-- Sources Section -->
                <div class="ml-[40px]">
                    <p class="mt-[20px] mb-[-8px]">Sources</p>
                    <div *ngIf="sources.length" class="mt-4 flex gap-4 flex-wrap">
                        <app-source-card class="flex gap-[16px]" [data]="sources"/>
                    </div>
                </div>
            </div>
            <!-- Task question here -->
            <div class="w-[100%]">
                <label class="bg-white flex items-center justify-between py-[12px] px-[12px]  border border-[#D5D7DA] rounded-[8px] gap-[16px] ">
                    <div class="flex gap-[8px] w-[90%]">
                        <span class="w-[16px] h-[17px] scale-[0.9] bg-[url('./app/resources/icons/chat-link-icon.svg')]"></span>
                        <input type="text" placeholder="Ask your question!" class="text-sm w-[100%]">
                    </div>
                    <span class="w-[18px] h-[18.86px] bg-[url('./app/resources/icons/blue-right-arrow-icon.svg')]"></span>
                </label>
            </div>
        </div>
    </div>
</div>
