<div class="w-[500px] ml-auto mr-auto mt-[200px]">
    <div *ngIf="isBrowser && auth" class="flex flex-col items-center justify-center  bg-gray-100 p-6">
        <h1 class="text-3xl font-bold mb-6">Welcome to the Login Page</h1>
        <ng-container *ngIf="(auth.isAuthenticated$ | async); else showLogin">
            <p class="text-green-600 text-lg mb-4">You are logged in!</p>
            <button
            (click)="auth.logout({ logoutParams: { returnTo: returnToUrl! } })"
            class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded shadow-md"
            >
            Logout
            </button>
        </ng-container>
        <ng-template #showLogin>
            <button
            (click)="auth.loginWithRedirect()"
            class="bg-primary hover:bg-blue-600 text-white font-bold py-2 px-4 rounded shadow-md"
            >
            Login
            </button>
        </ng-template>
    </div>
</div>
